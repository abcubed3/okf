<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" stroke="url(#glow-grad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Hexagon Graph Bounds -->
  <g filter="url(#neon-glow)">
    <!-- Outer Hexagon Edges -->
    <polygon points="256,60 430,160 430,360 256,460 82,360 82,160" fill="none" stroke="url(#glow-grad)" stroke-width="8" stroke-linejoin="round" stroke-opacity="0.85"/>

    <!-- Inner Network Triangulation Lines -->
    <line x1="256" y1="60" x2="256" y2="460" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6,6"/>
    <line x1="82" y1="160" x2="430" y2="360" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.4"/>
    <line x1="82" y1="360" x2="430" y2="160" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.4"/>

    <!-- Secondary Node Web -->
    <polygon points="256,120 375,190 375,330 256,400 137,330 137,190" fill="none" stroke="url(#glow-grad)" stroke-width="4" stroke-opacity="0.6"/>

    <!-- Graph Vertices (Nodes) -->
    <circle cx="256" cy="60" r="14" fill="#00f2fe"/>
    <circle cx="430" cy="160" r="14" fill="#3b82f6"/>
    <circle cx="430" cy="360" r="14" fill="#a78bfa"/>
    <circle cx="256" cy="460" r="14" fill="#c084fc"/>
    <circle cx="82" cy="360" r="14" fill="#3b82f6"/>
    <circle cx="82" cy="160" r="14" fill="#00f2fe"/>

    <circle cx="256" cy="120" r="8" fill="#ffffff"/>
    <circle cx="375" cy="190" r="8" fill="#ffffff"/>
    <circle cx="375" cy="330" r="8" fill="#ffffff"/>
    <circle cx="256" cy="400" r="8" fill="#ffffff"/>
    <circle cx="137" cy="330" r="8" fill="#ffffff"/>
    <circle cx="137" cy="190" r="8" fill="#ffffff"/>

    <!-- Go Gopher Silhouette Center -->
    <g transform="translate(186, 170) scale(0.7)">
      <!-- Gopher Body -->
      <path d="M 50,40 C 30,40 20,60 20,100 C 20,150 25,180 50,180 C 75,180 80,150 80,100 C 80,60 70,40 50,40 Z" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round"/>
      <!-- Gopher Ears -->
      <circle cx="22" cy="45" r="10" fill="none" stroke="#00f2fe" stroke-width="6"/>
      <circle cx="78" cy="45" r="10" fill="none" stroke="#00f2fe" stroke-width="6"/>
      <!-- Gopher Eyes -->
      <circle cx="38" cy="70" r="12" fill="#ffffff"/>
      <circle cx="38" cy="70" r="5" fill="#0b0f19"/>
      <circle cx="62" cy="70" r="12" fill="#ffffff"/>
      <circle cx="62" cy="70" r="5" fill="#0b0f19"/>
      <!-- Gopher Snout & Teeth -->
      <ellipse cx="50" cy="88" rx="10" ry="7" fill="#00f2fe"/>
      <rect x="46" y="94" width="8" height="8" rx="2" fill="#ffffff"/>
      <!-- Gopher Arms -->
      <path d="M 18,110 C 8,115 8,125 18,130" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
      <path d="M 82,110 C 92,115 92,125 82,130" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
