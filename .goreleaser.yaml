# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: okf

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    binary: okf
    main: ./cmd/okf
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.Date={{.Date}}

dockers_v2:
  - images:
      - ghcr.io/abcubed3/okf
    tags:
      - "{{ .Tag }}"
    dockerfile: Containerfile
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.ref.name": "{{ .Tag }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Open Knowledge Format CLI for validating, managing, and serving knowledge bundles."
      "org.opencontainers.image.authors": "abcubed3"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.url": "https://okfgo.dev"
      "org.opencontainers.image.documentation": "https://github.com/abcubed3/okf#readme"
      "org.opencontainers.image.licenses": "Apache-2.0"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
